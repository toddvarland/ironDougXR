name: ironDougXR

options:
  bundleIdPrefix: com.irondougxr
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: 5Q2YW9392K

targets:
  ironDougXR:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ironDougXR
    info:
      path: ironDougXR/Info.plist
      properties:
        NSCameraUsageDescription: "This app uses the camera to display and anchor AR markers in your environment."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irondougxr.app
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: 18.0
        SWIFT_STRICT_CONCURRENCY: complete
        # Icon source: tools/make_icon.swift (swift tools/make_icon.swift <out.png>)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework

  ironDougXRTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ironDougXRTests
    dependencies:
      - target: ironDougXR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irondougxr.tests
        SWIFT_STRICT_CONCURRENCY: complete

  ironDougXRUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - ironDougXRUITests
    dependencies:
      - target: ironDougXR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irondougxr.uitests

schemes:
  ironDougXR:
    build:
      targets:
        ironDougXR: all
        ironDougXRTests: [test]
        ironDougXRUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # Serial: tests share the app's Documents files, and parallel
        # simulator clones hang on this Xcode
        - name: ironDougXRTests
          parallelizable: false
        - name: ironDougXRUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
